version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: monday
      POSTGRES_PASSWORD: monday
      POSTGRES_DB: monday
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://monday:monday@db:5432/monday
    depends_on:
      - db

volumes:
  db-data:
